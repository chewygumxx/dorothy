#
# Bun's layer: tasks wrapping package.json's entry points
# https://mise.jdx.dev/tasks/task-configuration.html
#

[dev]
description = "Run Dorothy's CLI from source"
run         = "bun run dev"

[start]
description = "Start Dorothy's CLI"
run         = "bun run start"

[eval]
description = "Run Dorothy's evaluations"
run         = "bun run eval"

[skills]
description = "Link the skills skills-lock.json declares"
run         = "bun run skills"
