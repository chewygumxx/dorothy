#
#
# ~chewygumxx/dorothy.git
# ::: :/.config/mise/config.toml
#
#

#
# Sourced during CI by GitHub Action `jdx/mise-action`
# https://mise.jdx.dev/configuration.html
#

# ----------
# Intrinsic
# ----------

min_version = "2026.9.0"

# ------
# Tools
# ------

[tools]
# Javascript/TypeScript Runtime
bun = "1.4"

# Pi runs under Node >= 22.19
node = "24"

# Utilities
"aqua:jqlang/jq" = "1"  # statusline, check-secrets

# -----------------------
# Tools: Lint and Format
# -----------------------

# editorconfig
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"

# TOML
"aqua:tombi-toml/tombi" = "1.5.5"

# Shell
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh"            = "3.14.1"

# Secrets
"aqua:getsops/sops"    = "3.13.3"
"aqua:FiloSottile/age" = "1.3.2"

# YAML
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint"     = "1.38.0"

# Evidence packaging streams GNU tar (Linux system prerequisite) through zstd.
"conda:zstd" = { version = "1.5.7", channel = "conda-forge" }

# GitHub Actions
"aqua:rhysd/actionlint" = "1.7.12"

# ---------
# Settings
# ---------

[settings]
experimental = true  # the git:: remote task needs it

# ------------
# Environment
# ------------

[env]
YAMLLINT_CONFIG_FILE = "{{config_root}}/node_modules/@chewygumxx/yamllint-config/config.yaml"

# ------
# Tasks
# ------

[task_config]
includes = [ ".config/mise/tasks.toml" ]
