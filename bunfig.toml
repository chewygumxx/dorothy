#
# https://bun.com/docs/runtime/bunfig
#

# Package scripts' CLIs run on Bun, never on a Node found on PATH.
[run]
bun = true

# An undeclared import fails to resolve.
[install]
linker = "isolated"

# No .env reaches Dorothy's environment; secrets.json holds her secrets.
[env]
file = false

# Isolates the tests from the shell's colour, git and the user's data.
[test]
preload = [ "./test-setup.ts" ]
