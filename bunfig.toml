# ~chewygumxx/dorothy.git
# ::: :/bunfig.toml
#
#

#
# https://bun.com/docs/runtime/bunfig
#
# Runs every package script on Bun, the CLIs whose shebang names node
# included: `bun run` puts a `node` that is Bun first on `PATH`, nested
# scripts too, so a Node installed elsewhere, such as a CI runner's, never
# runs them.
#

[run]
bun = true

#
# Each package sees only what its package.json declares, so an undeclared
# import fails to resolve under Bun and tsc alike.
#

[install]
linker = "isolated"

#
# Core loads sops-encrypted secrets.json. Bun must not preload a .env
# from the working directory into Dorothy's environment.
#

[env]
file = false

#
# Tests compare rendered frames as plain text, whatever the shell's
# FORCE_COLOR says (see test-setup.ts).
#

[test]
preload = [ "./test-setup.ts" ]
